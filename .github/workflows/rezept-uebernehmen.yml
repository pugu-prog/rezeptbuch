name: Rezept automatisch übernehmen

# Claude-Cloud-Sitzungen pushen auf einen eigenen Branch (z. B. claude/...).
# Ändert ein Branch nur Dateien in rezepte/ und bilder/, wird er geprüft und nach main
# übernommen; danach wird die Seite neu veröffentlicht. Alles andere bleibt
# liegen, bis Guy es sich anschaut.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: rezept-uebernehmen
  cancel-in-progress: false

jobs:
  uebernehmen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nur Rezepte geändert?
        id: check
        run: |
          git fetch origin main
          geaendert=$(git diff --name-only origin/main...HEAD)
          echo "$geaendert"
          if [ -n "$geaendert" ] && ! echo "$geaendert" | grep -v -E '^(rezepte/[a-z0-9-]+\.json|bilder/[a-z0-9-]+\.(jpg|jpeg|png|webp))$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Branch ändert mehr als Rezepte – wird nicht automatisch übernommen."
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Prüfen, nach main übernehmen, veröffentlichen
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "rezeptbuch-bot"
          git config user.email "rezeptbuch-bot@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-edit "origin/$BRANCH"
          python3 scripts/build_index.py /tmp/check
          git push origin main
          git push origin --delete "$BRANCH" || true
          gh workflow run pages.yml --ref main
