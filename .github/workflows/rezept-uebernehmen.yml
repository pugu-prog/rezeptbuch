name: Rezept automatisch übernehmen

# Claude-Cloud-Sitzungen pushen auf einen eigenen Branch (z. B. claude/...).
# Ändert ein Branch nur Rezepte, Bilder, Kategorien oder die Texte der Webseite
# (index.html, sprachliche Korrekturen), wird er geprüft und nach main
# übernommen; danach wird die Seite neu veröffentlicht. Bei Änderungen an
# index.html wird die Seite vorher in Chrome geladen und getestet.
# Alles andere bleibt liegen, bis Guy es sich anschaut.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: rezept-uebernehmen
  cancel-in-progress: false

jobs:
  uebernehmen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nur erlaubte Dateien geändert?
        id: check
        run: |
          git fetch origin main
          geaendert=$(git diff --name-only origin/main...HEAD)
          echo "$geaendert"
          if [ -n "$geaendert" ] && ! echo "$geaendert" | grep -v -E '^(rezepte/[a-z0-9-]+\.json|bilder/[a-z0-9-]+\.(jpg|jpeg|png|webp)|index\.html|kategorien\.json)$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Branch ändert mehr als Rezepte/Texte – wird nicht automatisch übernommen."
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Zusammenführen und prüfen
        if: steps.check.outputs.ok == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "rezeptbuch-bot"
          git config user.email "rezeptbuch-bot@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-edit "origin/$BRANCH"
          mkdir -p /tmp/site
          cp index.html /tmp/site/
          cp -r rezepte /tmp/site/
          if [ -d bilder ]; then cp -r bilder /tmp/site/; fi
          python3 scripts/build_index.py /tmp/site
      - name: Webseite in Chrome testen
        if: steps.check.outputs.ok == 'true'
        run: |
          (cd /tmp/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "http://localhost:8080/#/" > /tmp/liste.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "http://localhost:8080/#/matmaachen" > /tmp/matmaachen.html
          python3 - <<'EOF'
          import html, json, sys
          liste = html.unescape(open("/tmp/liste.html", encoding="utf-8").read())
          mat = html.unescape(open("/tmp/matmaachen.html", encoding="utf-8").read())
          rezepte = json.load(open("/tmp/site/rezepte.json", encoding="utf-8"))
          fehlt = [r["titel"] for r in rezepte if r["titel"] not in liste]
          if fehlt or 'class="card"' not in liste:
              sys.exit(f"Test fehlgeschlagen – Rezepte fehlen auf der Seite: {fehlt}")
          if 'class="step"' not in mat:
              sys.exit("Test fehlgeschlagen – Matmaachen-Seite lädt nicht")
          print(f"Test ok: {len(rezepte)} Rezepte angezeigt")
          EOF
      - name: Nach main übernehmen und veröffentlichen
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin main
          git push origin --delete "$BRANCH" || true
          gh workflow run pages.yml --ref main
