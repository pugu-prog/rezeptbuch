<!doctype html>
<html lang="lb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eist Rezeptbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f7f0; --card:#ffffff; --ink:#1f2a1f; --muted:#5f6f5c; --line:#dbe5d5;
  --accent:#3f7d3a; --accent-soft:#e2efdc;
  --guy:#2f6690; --louis:#b8661f; --jacques:#a2507a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{padding:40px 0 20px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem)}
h1 a{text-decoration:none}
.sub{color:var(--muted);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.controls input{flex:1 1 240px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;font:500 .88rem Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:20px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgb(0 0 0 / .08)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.card .ph{aspect-ratio:16/10;background:var(--accent-soft);display:grid;place-items:center;font-size:2.6rem}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.2rem}
.meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.85rem}
.who{font-weight:600}
.who.Guy{color:var(--guy)} .who.Louis{color:var(--louis)} .who.Jacques{color:var(--jacques)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
/* Detail */
.back{display:inline-block;margin:28px 0 14px;color:var(--muted);text-decoration:none;font-weight:500}
.hero{display:block;margin-bottom:6px}.hero img{display:block;max-width:100%;max-height:440px;border-radius:14px;border:1px solid var(--line)}
.credit{color:var(--muted);font-size:.75rem;margin:0 0 20px}.credit a{color:inherit}
.blat{margin-top:22px;color:var(--muted);font-size:.85rem}.blat img{display:block;max-width:260px;width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.detail h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.detail .desc{font-size:1.08rem;margin:10px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
.fact{background:var(--accent-soft);padding:6px 12px;border-radius:8px;font-size:.9rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:32px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.box h3{font-size:1.25rem;margin-bottom:10px}
.box h4{margin:14px 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:baseline;cursor:pointer}
.ing li:last-child{border-bottom:0}
.ing li input{accent-color:var(--accent)}
.ing li.done span{text-decoration:line-through;color:var(--muted)}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.9rem}
.note{margin-top:22px;padding:14px 18px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0}
.tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;color:var(--muted);border:1px solid var(--line);padding:2px 9px;border-radius:99px}
.actions{margin:26px 0 60px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font:500 .9rem Inter,sans-serif;cursor:pointer;text-decoration:none}
.nav{margin-top:12px}.nav a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:16px}
.guide{max-width:760px;margin-bottom:60px}
.guide h2{font-size:clamp(1.7rem,5vw,2.3rem);margin-bottom:6px}
.guide .lead{color:var(--muted);margin:0 0 22px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px 64px;position:relative;margin-bottom:12px}
.step::before{content:attr(data-n);position:absolute;left:18px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{font-size:1.15rem;margin-bottom:6px}
.step p,.step ul{margin:6px 0}.step ul{padding-left:20px}
.step code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.92em}
.step.wer{border-style:dashed}
.big{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
.note ul{margin:6px 0 0;padding-left:20px}.note li{margin:4px 0}
.notizen{margin-top:26px}.notizen h3{font-size:1.25rem;margin-bottom:10px}
.notiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.notiz .meta{margin-bottom:4px}
.notiz-neu{color:var(--muted);font-size:.92rem;margin-top:8px}
.faq{margin-top:26px}.faq h3{font-size:1.2rem;margin-bottom:8px}.faq p{margin:6px 0 12px}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media print{
  header .controls,.nav,.chips,.back,.actions,footer{display:none}
  body{background:#fff;color:#000}.box{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#/">Eist Rezeptbuch</a></h1>
    <div class="sub">Gesammelt vum Guy, Louis &amp; Jacques</div>
    <nav class="nav"><a href="#/">Rezepter</a><a href="#/matmaachen">Matmaachen</a></nav>
  </header>
  <main id="app"><p class="empty">Rezepter gi gelueden…</p></main>
  <footer>Nei Rezepter kommen iwwer Claude dobäi – <a href="#/matmaachen">sou geet et</a>.</footer>
</div>
<script>
const EMOJI = {"Fréistéck":"🥐","Virspeis":"🥗","Zopp":"🍲","Zalot":"🥬","Haaptplat":"🍽️","Bäilag":"🥔","Dessert":"🍮","Kuch & Gebäck":"🍰","Snack":"🥨","Gedrénks":"🥤","Anescht":"📒"};
const NIVEAU = {"einfach":"einfach","mëttel":"mëttel","schwéier":"schwéier"};
const app = document.getElementById("app");
let rezepte = [], filter = {q:"", kat:"", autor:""};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const zeit = m => !m ? "" : m < 60 ? `${m} Min.` : `${Math.floor(m/60)} St.${m%60 ? " " + m%60 + " Min." : ""}`;

async function laden(){
  try{
    const r = await fetch("rezepte.json", {cache:"no-store"});
    if(!r.ok) throw 0;
    rezepte = await r.json();
  }catch{
    app.innerHTML = '<p class="empty">D’Rezepter konnten net geluede ginn.</p>'; return;
  }
  route();
}

function route(){
  const m = location.hash.match(/^#\/rezept\/(.+)$/);
  if(m){ detail(decodeURIComponent(m[1])); } else if(location.hash === "#/matmaachen"){ matmaachen(); } else { liste(); }
  window.scrollTo(0,0);
}

function chips(name, werte, alle){
  return `<div class="chips">` + [["",alle], ...werte.map(w=>[w,w])].map(([v,l]) =>
    `<button class="chip" data-f="${name}" data-v="${esc(v)}" aria-pressed="${filter[name]===v}">${esc(l)}</button>`).join("") + `</div>`;
}

function liste(){
  document.title = "Eist Rezeptbuch";
  const kats = [...new Set(rezepte.map(r=>r.kategorie))].sort();
  const autoren = [...new Set(rezepte.map(r=>r.autor))].sort();
  app.innerHTML = `
    <div class="controls"><input id="q" type="search" placeholder="Rezept, Zutat oder Stéchwuert sichen…" value="${esc(filter.q)}"></div>
    ${chips("kat", kats, "All Kategorien")}
    ${chips("autor", autoren, "All Käch")}
    <div class="grid" id="grid"></div>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { filter.q = q.value; karten(); });
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    filter[b.dataset.f] = b.dataset.v;
    app.querySelectorAll(`.chip[data-f="${b.dataset.f}"]`).forEach(x => x.setAttribute("aria-pressed", x===b));
    karten();
  });
  karten();
}

function flach(z){ return z.flatMap(x => typeof x === "string" ? [x] : [x.gruppe, ...(x.liste||[])]); }

function karten(){
  const q = filter.q.trim().toLowerCase();
  const treffer = rezepte.filter(r =>
    (!filter.kat || r.kategorie === filter.kat) &&
    (!filter.autor || r.autor === filter.autor) &&
    (!q || [r.titel, r.beschreibung, ...(r.tags||[]), ...flach(r.zutaten||[])].join(" ").toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML = treffer.length ? treffer.map(r => `
    <a class="card" href="#/rezept/${encodeURIComponent(r.slug)}">
      ${r.bild ? `<img src="${esc(r.bild)}" alt="" loading="lazy">` : `<div class="ph">${EMOJI[r.kategorie]||"📒"}</div>`}
      <div class="body">
        <h3>${esc(r.titel)}</h3>
        <div class="meta"><span class="who ${esc(r.autor)}">${esc(r.autor)}</span><span>${esc(r.kategorie)}</span>${r.zeit_minuten?`<span>⏱ ${zeit(r.zeit_minuten)}</span>`:""}</div>
      </div>
    </a>`).join("") : `<p class="empty">Näischt fonnt.</p>`;
}

function zutatenHtml(z){
  let html = "", offen = false;
  const li = s => `<li><input type="checkbox"><span>${esc(s)}</span></li>`;
  for(const x of z){
    if(typeof x === "string"){ if(!offen){ html += `<ul class="ing">`; offen = true; } html += li(x); }
    else { if(offen){ html += `</ul>`; offen = false; } html += `<h4>${esc(x.gruppe)}</h4><ul class="ing">${(x.liste||[]).map(li).join("")}</ul>`; }
  }
  return html + (offen ? `</ul>` : "");
}

function detail(slug){
  const r = rezepte.find(x => x.slug === slug);
  if(!r){ app.innerHTML = `<a class="back" href="#/">← All Rezepter</a><p class="empty">Rezept net fonnt.</p>`; return; }
  document.title = r.titel + " – Eist Rezeptbuch";
  const facts = [
    r.portionen && `🍴 ${r.portionen} Portiounen`,
    r.zeit_minuten && `⏱ ${zeit(r.zeit_minuten)}`,
    r.schwierigkeit && `📈 ${NIVEAU[r.schwierigkeit]||r.schwierigkeit}`,
    `${EMOJI[r.kategorie]||"📒"} ${r.kategorie}`,
  ].filter(Boolean);
  app.innerHTML = `
    <a class="back" href="#/">← All Rezepter</a>
    <article class="detail">
      ${r.bild ? `<a class="hero" href="${esc(r.bild)}" target="_blank" rel="noopener" title="Bild grouss opmaachen"><img src="${esc(r.bild)}" alt="${esc(r.titel)}"></a>${r.bild_quelle ? `<p class="credit">${linkify(r.bild_quelle)}</p>` : `<div style="height:14px"></div>`}` : ""}
      <h2>${esc(r.titel)}</h2>
      <div class="meta" style="margin-top:8px">vum <span class="who ${esc(r.autor)}">${esc(r.autor)}</span>${r.hinzugefuegt?` · ${new Date(r.hinzugefuegt).toLocaleDateString("de-LU")}`:""}</div>
      ${r.beschreibung ? `<p class="desc">${esc(r.beschreibung)}</p>` : ""}
      <div class="facts">${facts.map(f=>`<span class="fact">${esc(f)}</span>`).join("")}</div>
      <div class="cols">
        <div class="box"><h3>Zutaten</h3>${zutatenHtml(r.zutaten||[])}</div>
        <div class="box"><h3>Preparatioun</h3><ol class="steps">${(r.schritte||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
      </div>
      ${tippsHtml(r.tipps)}
      ${r.quelle ? `<p class="meta" style="margin-top:14px">Quell: ${/^https?:/.test(r.quelle) ? `<a href="${esc(r.quelle)}" target="_blank" rel="noopener">${esc(r.quelle)}</a>` : esc(r.quelle)}</p>` : ""}
      ${r.rezeptblat ? `<div class="blat">Original-Rezeptblat (klicken fir grouss):<a href="${esc(r.rezeptblat)}" target="_blank" rel="noopener"><img src="${esc(r.rezeptblat)}" alt="Rezeptblat ${esc(r.titel)}" loading="lazy"></a></div>` : ""}
      ${(r.tags||[]).length ? `<div class="tags">${r.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
      <section class="notizen"><h3>Notizen &amp; Iddien</h3>
        ${(r.notizen||[]).map(n => `<div class="notiz"><div class="meta"><span class="who ${esc(n.autor)}">${esc(n.autor)}</span>${n.datum?`<span>${new Date(n.datum).toLocaleDateString("de-LU")}</span>`:""}</div>${esc(n.text)}</div>`).join("") || `<p class="notiz-neu">Nach keng Notizen.</p>`}
        <p class="notiz-neu">Eng Iddi, wéi et nach besser gëtt? <a href="${notizLink(r)}" target="_blank" rel="noopener">Notiz iwwer Claude derbäisetzen ↗</a></p>
      </section>
      <div class="actions"><button class="btn" onclick="print()">Drécken</button></div>
    </article>`;
  app.querySelectorAll(".ing li").forEach(li => li.onclick = e => {
    const cb = li.querySelector("input"); if(e.target !== cb) cb.checked = !cb.checked;
    li.classList.toggle("done", cb.checked);
  });
}

const CLAUDE_LINK = "https://claude.ai/code?repositories=" + encodeURIComponent("pugu-prog/rezeptbuch") +
  "&prompt=" + encodeURIComponent("Setz dëst Rezept an eist Famill-Rezeptbuch (Reegelen an der CLAUDE.md). Ech sinn de ");

function linkify(t){ return esc(t).replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">Quell</a>'); }

function tippsHtml(t){
  if(!t || (Array.isArray(t) && !t.length)) return "";
  if(!Array.isArray(t)) return `<div class="note"><strong>Tipp:</strong> ${esc(t)}</div>`;
  return `<div class="note"><strong>Tipps</strong><ul>${t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

function notizLink(r){
  return "https://claude.ai/code?repositories=" + encodeURIComponent("pugu-prog/rezeptbuch") + "&prompt=" +
    encodeURIComponent(`Ech hunn eng Notiz zum Rezept „${r.titel}“ (rezepte/${r.slug}.json) – Reegelen an der CLAUDE.md. Ech sinn de `);
}

function matmaachen(){
  document.title = "Matmaachen – Eist Rezeptbuch";
  app.innerHTML = `
  <article class="guide">
    <h2>Sou setz du Rezepter derbäi</h2>
    <p class="lead">Fir de Louis an de Jacques: Schrëtt 1–5 maacht dir nëmmen eng Kéier. Duerno ass et just nach Schrëtt 6.</p>

    <div class="step" data-n="1"><h3>Claude-Abo kucken</h3>
      <p>Mir benotze <b>Claude Code</b>. Dat geet mat <b>Claude Pro</b> oder <b>Max</b>, net mam Gratis-Kont.
      Kuck op <a href="https://claude.ai/settings/billing" target="_blank" rel="noopener">claude.ai → Astellungen → Abonnement</a>.</p></div>

    <div class="step" data-n="2"><h3>GitHub-Kont maachen (gratis)</h3>
      <ul>
        <li>Op <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> goen.</li>
        <li>Eng E-Mail-Adress aginn (z. B. deng iCloud-Adress – et muss net déi vum Claude-Kont sinn), e Passwuert an e <b>Benotzernumm</b> (z. B. <code>louisputz</code>) auswielen.</li>
        <li>De Code aginn, deen GitHub der per Mail schéckt.</li>
        <li>Fragen zu Plang/Team: einfach <b>Free</b> / „Skip“.</li>
      </ul></div>

    <div class="step" data-n="3"><h3>De Benotzernumm dem Papp schécken</h3>
      <p>Schéck dem Guy däi GitHub-Benotzernumm. E lued dech an d'Rezeptbuch an.</p></div>

    <div class="step" data-n="4"><h3>Invitatioun unhuelen</h3>
      <p>Du kriss eng Mail vu GitHub: <i>„pugu-prog invited you to collaborate on pugu-prog/rezeptbuch“</i>.
      Op <b>View invitation</b> an dann <b>Accept invitation</b> klicken.<br>
      Keng Mail? Direkt hei: <a href="https://github.com/pugu-prog/rezeptbuch/invitations" target="_blank" rel="noopener">github.com/pugu-prog/rezeptbuch/invitations</a></p></div>

    <div class="step" data-n="5"><h3>Claude Code mat GitHub verbannen</h3>
      <ul>
        <li><a href="https://claude.ai/code" target="_blank" rel="noopener">claude.ai/code</a> opmaachen (oder an der Claude-App um Handy den Tab <b>Code</b>) an mat dengem Claude-Kont aloggen.</li>
        <li>Claude freet dech, GitHub ze verbannen: mat dengem GitHub-Kont umellen an <b>Authorize</b> klicken.</li>
        <li>Wann et freet, d'„Claude GitHub App“ ze installéieren: <b>Skip</b> geet duer.</li>
      </ul></div>

    <div class="step" data-n="6"><h3>Rezept derbäisetzen</h3>
      <p>Op dëse Knäppchen klicken – d'Rezeptbuch an den Ufank vum Text sinn da schonn ausgefëllt:</p>
      <a class="big" href="${CLAUDE_LINK}" target="_blank" rel="noopener">Rezept derbäisetzen ↗</a>
      <ul>
        <li>Däin Numm fäerdeg schreiwen („… Ech sinn de Louis.“) an d'Rezept derbäi: Text, <b>Foto</b> vum Zettel, Screenshot oder Link.</li>
        <li>Claude weist der d'Rezept op Lëtzebuergesch. Wann et stëmmt: „ok, späicher et“.</li>
        <li>No 1–2 Minutten ass et hei op der Säit.</li>
      </ul>
      <p>Ouni Knäppchen: an claude.ai/code ënnen de Repo <code>pugu-prog/rezeptbuch</code> auswielen an et einfach soen.</p></div>

    <div class="faq">
      <h3>Wann eppes net geet</h3>
      <p><b>D'Rezeptbuch steet net an der Lëscht:</b> Invitatioun (Schrëtt 4) nach net ugeholl, oder GitHub nach net verbonnen (Schrëtt 5).</p>
      <p><b>„Claude Code isn't available on your account“:</b> kee Pro-Abo (Schrëtt 1).</p>
      <p><b>Rezept ass no 5 Minutten nach net do:</b> dem Guy Bescheed soen.</p>
    </div>
  </article>`;
}

addEventListener("hashchange", route);
laden();
</script>
</body>
</html>
